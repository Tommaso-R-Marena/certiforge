[workspace]
resolver = "2"
members = [
    "crates/certir",
    "crates/certir-parser",
    "crates/certir-interpreter",
    "crates/certiforge-package",
    "crates/certiforge-cli",
    "crates/forgeopt",
    "crates/forgeopt-search",
    "crates/forgeopt-cost",
    "crates/forgeopt-bench",
    "crates/certiforge-fuzz",
    "crates/certiforge-mutate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Tommaso-R-Marena/certiforge"
authors = ["CERTIFORGE contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
proptest = "1"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"

certir = { path = "crates/certir" }
certir-parser = { path = "crates/certir-parser" }
certir-interpreter = { path = "crates/certir-interpreter" }
certiforge-package = { path = "crates/certiforge-package" }
forgeopt = { path = "crates/forgeopt" }
forgeopt-search = { path = "crates/forgeopt-search" }
forgeopt-cost = { path = "crates/forgeopt-cost" }
forgeopt-bench = { path = "crates/forgeopt-bench" }
certiforge-mutate = { path = "crates/certiforge-mutate" }
certiforge-fuzz = { path = "crates/certiforge-fuzz" }
