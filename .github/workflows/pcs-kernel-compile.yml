name: pcs-kernel-compile
on:
  push:
    branches:
      - pcs-kernel-compile-2026-09-28
    paths:
      - 'scratch/pcs-kernel/**'
      - '.github/workflows/pcs-kernel-compile.yml'

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build PCS Lean kernel
        working-directory: scratch/pcs-kernel/formal
        run: |
          lake build
          ! grep -R --line-number --fixed-strings 'sorry' PCS.lean PCS
