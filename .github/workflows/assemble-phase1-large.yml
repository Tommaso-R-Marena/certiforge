name: assemble-phase1-large
on:
  push:
    paths:
      - '.ci/assemble_payloads/**'
      - '.github/workflows/assemble-phase1-large.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble large Phase I files
        run: |
          python3 << 'PY'
          import pathlib, zlib, base64, hashlib
          root = pathlib.Path('.')
          def assemble(prefix, n, dest, expect_sha):
              b64 = ''.join((root/f'.ci/assemble_payloads/{prefix}.{i}.b64').read_text().strip() for i in range(n))
              data = zlib.decompress(base64.b64decode(b64))
              got = hashlib.sha256(data).hexdigest()
              assert got == expect_sha, (got, expect_sha)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              print('wrote', dest, got)
          assemble('pkg', 4, root/'crates/certiforge-package/src/lib.rs',
                   '4337357daec59eb605d06c8452ce34509762fb75840053a7ce97091689bdbdc7')
          assemble('lock', 4, root/'Cargo.lock',
                   'da1815555b8a3bb183de088f9fdb82e039ef6634e1d335e4246a28d56f310ebb')
          PY
          git config user.name "certiforge-assembler"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/certiforge-package/src/lib.rs Cargo.lock
          git commit -m "Add Phase I sources (batch 1-2/6 large files)" || echo "no changes"
          git push
